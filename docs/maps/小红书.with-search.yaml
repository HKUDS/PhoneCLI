common_tasks:
- Browse the recommended content feed on the home screen
- Switch between different content categories using top tabs
- View and interact with user posts including likes and comments
- Navigate to the e-commerce marketplace to browse products and prices
- Check notification center for likes, follows, and comments
- Access activity messages and system notifications
- Use bottom navigation bar to switch between main app sections
