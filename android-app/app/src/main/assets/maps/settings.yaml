common_tasks:
- Connect to or manage Wi-Fi networks
- Pair with Bluetooth devices
- Check device storage usage and clean up files
- View device information and system version
- Configure lock screen timeout and gestures
- Manage Xiaomi account settings and cloud services
- Adjust network acceleration and dual WLAN settings
- Rename the device
known_limitations:
- Some advanced settings are nested within sub-menus requiring multiple navigation
  steps
- Dialogs for renaming devices or setting timeouts may obscure underlying options
  until dismissed
- Agreement confirmation dialogs can interrupt workflow if not expected
