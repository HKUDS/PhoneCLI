org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true

# No proxy: this machine reaches the SDK repository directly. The proxy that
# used to be configured here is gone, and a dead proxy in this file makes
# every SDK download fail with "Connection refused".

# let Gradle fetch a missing SDK platform (licences are accepted in .toolchain/android-sdk/licenses)
android.builder.sdkDownload=true
